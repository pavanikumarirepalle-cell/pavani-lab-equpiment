<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment | Mamatha College</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/css/style.css"></head><body data-page="equipment"><div id="appNav"></div><main class="wrap page-main"><div class="page-head"><div><span class="eyebrow">RESOURCE CENTER / INVENTORY</span><h1>Equipment <em>library.</em></h1><p>One organized place for every instrument, tool and lab resource.</p></div><button class="btn btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> Add equipment</button></div><div class="page-cover equipment-cover"><div><span>KEEP YOUR INVENTORY IN CHECK</span><h2>Know what you have.<br>Know what’s ready.</h2></div><img src="https://images.unsplash.com/photo-1581093458791-9d42e3c4f4f1?auto=format&fit=crop&w=650&q=80" alt="Laboratory instruments"></div><div class="toolbar"><label class="searchbox"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" placeholder="Search equipment or category…"></label><select id="filterSelect"><option value="">All categories</option><option>Electronics</option><option>Computer</option><option>Physics</option><option>Chemistry</option><option>Workshop</option><option>Other</option></select><span class="result-count" id="resultCount"></span></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Equipment</th><th>Category</th><th>Total units</th><th>Available</th><th>Status</th><th>Actions</th></tr></thead><tbody id="equipmentBody"><tr><td colspan="6">Loading inventory…</td></tr></tbody></table></div></section></main><dialog id="recordDialog" class="modal"><form id="recordForm"><div class="modal-head"><div><span class="eyebrow">INVENTORY DETAILS</span><h2 id="modalTitle">Add equipment</h2></div><button type="button" class="icon-btn" data-close><i class="fa-solid fa-xmark"></i></button></div><input type="hidden" name="id"><div class="form-grid"><label class="full">Equipment name<input name="name" required maxlength="100" placeholder="e.g. Digital Multimeter"></label><label>Category<select name="category" required><option value="">Choose category</option><option>Electronics</option><option>Computer</option><option>Physics</option><option>Chemistry</option><option>Workshop</option><option>Other</option></select></label><label>Total quantity<input type="number" name="quantity" min="0" required></label></div><p class="form-message" id="formMessage"></p><div class="modal-actions"><button type="button" class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" type="submit">Save equipment</button></div></form></dialog><script src="/js/app.js"></script></body></html>
