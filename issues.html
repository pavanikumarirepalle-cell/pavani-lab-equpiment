<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issue Desk | Mamatha College</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/css/style.css"></head><body data-page="issues"><div id="appNav"></div><main class="wrap page-main"><div class="page-head"><div><span class="eyebrow">CIRCULATION / ISSUE & RETURN</span><h1>Issue <em>desk.</em></h1><p>Track who has what, when it went out and when it comes back.</p></div><button class="btn btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> New issue</button></div><div class="page-cover issue-cover"><div><span>EVERY MOVEMENT, ACCOUNTED FOR</span><h2>From the shelf<br>to the student.</h2></div><img src="https://images.unsplash.com/photo-1581092921461-eab62e97a780?auto=format&fit=crop&w=650&q=80" alt="Laboratory technician working with equipment"></div><div class="toolbar"><label class="searchbox"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" placeholder="Search equipment or member…"></label><select id="filterSelect"><option value="">All records</option><option>Issued</option><option>Returned</option></select><span class="result-count" id="resultCount"></span></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Record</th><th>Equipment</th><th>Issued to</th><th>Issue date</th><th>Return date</th><th>Qty</th><th>Status</th><th>Actions</th></tr></thead><tbody id="issuesBody"><tr><td colspan="8">Loading issue records…</td></tr></tbody></table></div></section></main><dialog id="recordDialog" class="modal"><form id="recordForm"><div class="modal-head"><div><span class="eyebrow">ISSUE REGISTER</span><h2 id="modalTitle">Create issue record</h2></div><button type="button" class="icon-btn" data-close><i class="fa-solid fa-xmark"></i></button></div><input type="hidden" name="id"><div class="form-grid"><label class="full">Equipment<select name="equipment_id" id="equipmentOptions" required><option value="">Choose equipment</option></select></label><label class="full">Issued to<select name="user_id" id="userOptions" required><option value="">Choose member</option></select></label><label>Quantity<input name="quantity" type="number" min="1" value="1" required></label><label>Issue date<input name="issue_date" type="date" required></label></div><p class="form-message" id="formMessage"></p><div class="modal-actions"><button type="button" class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" type="submit">Save issue record</button></div></form></dialog><script src="/js/app.js"></script></body></html>
